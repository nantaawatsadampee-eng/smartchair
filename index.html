<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Chair AI Web Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; border: none; border-radius: 6px; cursor: pointer; background: #007bff; color: white; }
        button:disabled { background: #ccc; }
        #status { font-size: 24px; font-weight: bold; margin: 15px 0; color: #28a745; }
        #video-container { position: relative; width: 100%; display: inline-block; }
        video, canvas { width: 100%; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ระบบเก้าอี้อัจฉริยะ (Smart Chair Web)</h2>
        <div>
            <button id="connectBtn" onclick="connectBLE()">1. เชื่อมต่อ Bluetooth</button>
            <button id="startCamBtn" onclick="startCamera()" disabled>2. เปิดกล้อง AI</button>
        </div>
        <div id="bleStatus">สถานะ BLE: ยังไม่ได้เชื่อมต่อ</div>
        <div id="status">ท่านั่ง: รอเปิดกล้อง...</div>
        
        <div id="video-container">
            <video id="webcam" autoplay playsinline style="display:none;"></video>
            <canvas id="output_canvas"></canvas>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        
        let bleCharacteristic = null;
        let lastState = null;

        async function connectBLE() {
            try {
                document.getElementById('bleStatus').innerText = "กำลังค้นหาอุปกรณ์...";
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                document.getElementById('bleStatus').innerText = "สถานะ BLE: เชื่อมต่อสำเร็จ ✓";
                document.getElementById('startCamBtn').disabled = false;
            } catch (error) {
                document.getElementById('bleStatus').innerText = "การเชื่อมต่อขัดข้อง: " + error;
            }
        }

        async function sendBLE(data) {
            if (bleCharacteristic && data !== lastState) {
                lastState = data;
                const enc = new TextEncoder();
                await bleCharacteristic.writeValue(enc.encode(data));
            }
        }

        function startCamera() {
            const videoElement = document.getElementById('webcam');
            const canvasElement = document.getElementById('output_canvas');
            const canvasCtx = canvasElement.getContext('2d');
            const statusDiv = document.getElementById('status');

            const pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            pose.onResults((results) => {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

                if (results.poseLandmarks) {
                    const landmarks = results.poseLandmarks;
                    const leftEar = landmarks[7], rightEar = landmarks[8];
                    const leftShoulder = landmarks[11], rightShoulder = landmarks[12];

                    const shoulderDiff = Math.abs(leftShoulder.y - rightShoulder.y);
                    const isTilt = shoulderDiff > 0.045;

                    const avgEarY = (leftEar.y + rightEar.y) / 2;
                    const avgShoulderY = (leftShoulder.y + rightShoulder.y) / 2;
                    const isSlouch = (avgShoulderY - avgEarY) < 0.12;

                    if (isTilt || isSlouch) {
                        statusDiv.innerText = "ท่านั่ง: BAD POSTURE (ผิดท่า)";
                        statusDiv.style.color = "red";
                        sendBLE("1");
                    } else {
                        statusDiv.innerText = "ท่านั่ง: NORMAL (ปกติ)";
                        statusDiv.style.color = "green";
                        sendBLE("0");
                    }
                }
                canvasCtx.restore();
            });

            const camera = new Camera(videoElement, {
                onFrame: async () => { await pose.send({ image: videoElement }); },
                width: 640, height: 480
            });
            camera.start();
        }
    </script>
</body>
</html>
