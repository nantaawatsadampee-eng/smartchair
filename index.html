<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเก้าอี้อัจฉริยะ (Smart Chair Web)</title>
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; }
        .btn-group { margin: 15px 0; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        button { padding: 12px 22px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; }
        .btn-ble { background: #007bff; }
        .btn-ble:hover { background: #0056b3; }
        .btn-cam { background: #28a745; }
        .btn-cam:hover { background: #218838; }
        #bleStatus { font-size: 14px; color: #495057; margin-bottom: 10px; padding: 10px; background: #e9ecef; border-radius: 6px; }
        #status { font-size: 24px; font-weight: bold; margin: 15px 0; color: #28a745; }
        #video-container { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: #000; margin-top: 15px; min-height: 240px; }
        video, canvas { width: 100%; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ระบบเก้าอี้อัจฉริยะ (Smart Chair Web)</h2>
        
        <div id="bleStatus">สถานะ BLE: ยังไม่ได้เชื่อมต่อ</div>
        
        <div class="btn-group">
            <button class="btn-ble" onclick="connectBLE()">1. เชื่อมต่อ Bluetooth</button>
            <button class="btn-cam" id="camBtn" onclick="startCamera()">2. เปิดกล้อง AI</button>
        </div>

        <div id="status">ท่านั่ง: รอเปิดกล้อง...</div>
        
        <div id="video-container">
            <video id="webcam" autoplay playsinline style="display:none;"></video>
            <canvas id="output_canvas"></canvas>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        
        let bleCharacteristic = null;
        let lastState = null;
        let isCameraRunning = false;

        // 1. ระบบเชื่อมต่อ Bluetooth
        async function connectBLE() {
            const bleStatusDiv = document.getElementById('bleStatus');
            try {
                bleStatusDiv.innerText = "กำลังค้นหาอุปกรณ์ Bluetooth...";
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                bleStatusDiv.innerText = "กำลังเชื่อมต่อกับ " + (device.name || "ESP32") + "...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                
                bleStatusDiv.innerText = "สถานะ BLE: เชื่อมต่อสำเร็จ ✓";
                bleStatusDiv.style.background = "#d4edda";
                bleStatusDiv.style.color = "#155724";
            } catch (error) {
                console.error("BLE Error:", error);
                bleStatusDiv.innerText = "การเชื่อมต่อขัดข้อง: " + error.message;
                bleStatusDiv.style.background = "#f8d7da";
                bleStatusDiv.style.color = "#721c24";
            }
        }

        // 2. ระบบส่งข้อมูลไปยัง ESP32
        async function sendBLE(data) {
            if (bleCharacteristic && data !== lastState) {
                lastState = data;
                try {
                    const enc = new TextEncoder();
                    await bleCharacteristic.writeValue(enc.encode(data));
                } catch (e) {
                    console.error("ส่ง BLE ล้มเหลว:", e);
                }
            }
        }

        // 3. ระบบเปิดกล้องและประมวลผล AI
        async function startCamera() {
            const statusDiv = document.getElementById('status');
            const camBtn = document.getElementById('camBtn');
            
            if (isCameraRunning) return;
            
            statusDiv.innerText = "กำลังเปิดกล้องและโหลดโมเดล AI...";
            statusDiv.style.color = "#007bff";

            try {
                const videoElement = document.getElementById('webcam');
                const canvasElement = document.getElementById('output_canvas');
                const canvasCtx = canvasElement.getContext('2d');

                const pose = new Pose({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
                });

                pose.setOptions({
                    modelComplexity: 1,
                    smoothLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                pose.onResults((results) => {
                    canvasElement.width = videoElement.videoWidth || 640;
                    canvasElement.height = videoElement.videoHeight || 480;
                    
                    canvasCtx.save();
                    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                    
                    // แสดงภาพแบบกระจกเงา
                    canvasCtx.translate(canvasElement.width, 0);
                    canvasCtx.scale(-1, 1);
                    canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                    canvasCtx.restore();

                    if (results.poseLandmarks) {
                        const landmarks = results.poseLandmarks;
                        const leftEar = landmarks[7];
                        const rightEar = landmarks[8];
                        const leftShoulder = landmarks[11];
                        const rightShoulder = landmarks[12];

                        // ตรวจจับนั่งเอียง
                        const shoulderDiff = Math.abs(leftShoulder.y - rightShoulder.y);
                        const isTilt = shoulderDiff > 0.045;

                        // ตรวจจับหลังค่อม / ก้มคอ
                        const avgEarY = (leftEar.y + rightEar.y) / 2;
                        const avgShoulderY = (leftShoulder.y + rightShoulder.y) / 2;
                        const isSlouch = (avgShoulderY - avgEarY) < 0.12;

                        const isBad = isTilt || isSlouch;

                        if (isBad) {
                            statusDiv.innerText = "ท่านั่ง: BAD POSTURE (ผิดท่า)";
                            statusDiv.style.color = "#dc3545";
                            sendBLE("1");
                        } else {
                            statusDiv.innerText = "ท่านั่ง: NORMAL (ปกติ)";
                            statusDiv.style.color = "#28a745";
                            sendBLE("0");
                        }
                    } else {
                        statusDiv.innerText = "ท่านั่ง: ไม่พบผู้ใช้งานในกล้อง";
                        statusDiv.style.color = "#ffc107";
                    }
                });

                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await pose.send({ image: videoElement });
                    },
                    width: 640,
                    height: 480
                });

                await camera.start();
                isCameraRunning = true;
                camBtn.innerText = "✓ กล้องกำลังทำงาน";
                camBtn.style.background = "#6c757d";

            } catch (err) {
                console.error("Camera Error:", err);
                statusDiv.innerText = "เปิดกล้องไม่สำเร็จ: โปรดกดอนุญาตสิทธิ์ใช้งานกล้องใน Chrome";
                statusDiv.style.color = "#dc3545";
            }
        }
    </script>
</body>
</html>
