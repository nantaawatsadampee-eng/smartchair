<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Chair Controller</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; }
        .btn-connect { background-color: #008CBA; color: white; }
        .status { font-weight: bold; margin-top: 15px; color: #333; }
    </style>
</head>
<body>

    <h2>ระบบควบคุมเก้าอี้อัจฉริยะ (Smart Chair)</h2>
    <button id="connectBtn" class="btn-connect" onclick="connectBLE()">เชื่อมต่อเก้าอี้ (BLE)</button>
    <div id="status" class="status">สถานะ: ยังไม่ได้เชื่อมต่อ</div>

    <script>
        // UUID ต้องตรงกับในโค้ด ESP32
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bluetoothDevice;
        let postureCharacteristic;

        async function connectBLE() {
            const statusText = document.getElementById("status");
            const connectBtn = document.getElementById("connectBtn");

            try {
                statusText.innerText = "สถานะ: กำลังค้นหาอุปกรณ์...";

                // สแกนหาอุปกรณ์ชื่อ SmartChair_ESP32
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'SmartChair_ESP32' }],
                    optionalServices: [SERVICE_UUID]
                });

                statusText.innerText = "สถานะ: กำลังเชื่อมต่อบลูทูธ...";
                const server = await bluetoothDevice.gatt.connect();

                // เข้าถึง Service และ Characteristic
                const service = await server.getPrimaryService(SERVICE_UUID);
                postureCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusText.innerText = "สถานะ: เชื่อมต่อสำเร็จเรียบร้อย!";
                statusText.style.color = "green";
                connectBtn.style.backgroundColor = "#4CAF50";

                // เฝ้าระวังกรณีบลูทูธหลุด
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                console.error("Error:", error);
                statusText.innerText = "สถานะ: การเชื่อมต่อล้มเหลว (" + error.message + ")";
                statusText.style.color = "red";
            }
        }

        function onDisconnected() {
            const statusText = document.getElementById("status");
            const connectBtn = document.getElementById("connectBtn");
            
            statusText.innerText = "สถานะ: บลูทูธขาดการเชื่อมต่อ";
            statusText.style.color = "red";
            connectBtn.style.backgroundColor = "#008CBA";
        }

        // ฟังก์ชันสำหรับส่งสถานะท่านั่งไปหา ESP32 ('1' = ท่าผิด, '0' = ท่าปกติ)
        async function sendPostureStatus(isBadPosture) {
            if (!postureCharacteristic) return;
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(isBadPosture ? "1" : "0");
                await postureCharacteristic.writeValue(data);
            } catch (error) {
                console.error("ส่งข้อมูลไม่สำเร็จ:", error);
            }
        }
    </script>
</body>
</html>
